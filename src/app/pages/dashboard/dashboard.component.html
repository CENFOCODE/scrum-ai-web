<div>
  <h1></h1>

  <div class="mt-2">
    <p class="invite-label">Invita a tu equipo</p>
    <div class="d-flex">
      <button class="primary-btn me-3" (click)="sendInviteToCall()">Invitar</button>
      <button class="btn btn-outline-secondary" (click)="joinToCall()">Unirse</button>
      <div class="d-flex" *ngIf="currentRoomId != ''">
        <p>Id para unirse</p>
        <p>{{ currentRoomId }}</p>
      </div>
    </div>
  </div>
 
  <app-chatbot [aiTemplate]="aiTemplate"/>
</div>

<div class="container my-4">
  <div class="card p-4 shadow-sm">

    <h2 class="fw-semibold mb-2">Daily – Paso 2</h2>
    <small class="text-muted">Responde las 3 preguntas de la Daily</small>

    <div class="mt-4">

      <!-- Pregunta 1 -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>1. ¿Qué hice ayer?</mat-label>
        <textarea
          matInput
          rows="3"
          [(ngModel)]="answers.yesterday"
          placeholder="Escribe aquí tu progreso de ayer..."
        ></textarea>
      </mat-form-field>

      <!-- Pregunta 2 -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>2. ¿Qué haré hoy?</mat-label>
        <textarea
          matInput
          rows="3"
          [(ngModel)]="answers.today"
          placeholder="Escribe lo que planeas hacer hoy..."
        ></textarea>
      </mat-form-field>

      <!-- Pregunta 3 -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>3. ¿Tengo impedimentos?</mat-label>
        <textarea
          matInput
          rows="3"
          [(ngModel)]="answers.impediments"
          placeholder="Describe tus bloqueos..."
        ></textarea>
      </mat-form-field>

    </div>

    <div class="d-flex justify-content-between mt-4">
      <button mat-button color="primary" class="btn btn-outline-secondary px-4" (click)="goBack()">
        Anterior
      </button>

      <button mat-raised-button color="primary" class="btn btn-success px-4" (click)="goNext()">
        Siguiente
      </button>
    </div>

  </div>
</div>

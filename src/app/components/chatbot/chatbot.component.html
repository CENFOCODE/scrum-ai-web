<!-- Botón toggle fuera del sidebar -->
<button class="chatbot-toggle" (click)="toggleChatbot()">
  <i class="fa-solid fa-message"></i>
</button>

<div class="chatbot-sidebar shadow-sm bg-white rounded" [class.closed]="!visible">

  <!-- Header -->
  <div class="chatbot-header">
    <span class="title">Chat con IA</span>
  </div>

  <!-- Mensajes -->
  <div class="messages-container">
    <div
      *ngFor="let msg of messages"
      [ngClass]="msg.from === 'Usuario' ? 'message-user' : 'message-ai'"
    >
      <div class="message-header">
        <i [class]="msg.from === 'Usuario' ? 'fa-solid fa-user' : 'fa-solid fa-robot'"></i>
        <strong>{{ msg.from }}</strong>
      </div>
      <div class="message-content">{{ msg.prompt }}</div>
    </div>

    <!-- Indicador de carga -->
    <div *ngIf="loading" class="message-ai loading-indicator">
      <div class="message-header">
        <i class="fa-solid fa-robot"></i>
        <strong>Scrum AI</strong>
      </div>
      <div class="message-content">
        <span class="dots">
          <span></span><span></span><span></span>
        </span>
        Escribiendo...
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <input
      #userInput
      type="text"
      placeholder="Escribe tu pregunta..."
      (keyup.enter)="sendMessage(userInput)"
      [disabled]="loading"
    />
    <button
      (click)="sendMessage(userInput)"
      [disabled]="loading"
      class="send-button"
    >
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

</div>

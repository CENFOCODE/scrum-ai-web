
<div class="chatbot-sidebar" [class.closed]="!visible">
 
  <button class="chatbot-toggle" (click)="toggleChatbot()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
      <path d="M0 3a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm5-1v12h9a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zM4 2H2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h2z"/>
    </svg>
  </button>

  <!-- Header del chatbot -->
 
  <div class="chatbot-header">
    <i class="fa-solid fa-robot"></i>
    <span class="title">Scrum AI</span>
  </div>

  <!-- Área de mensajes -->
  <div class="messages-container">
    <div
      *ngFor="let msg of messages"
      [ngClass]="msg.from === 'Usuario' ? 'message-user' : 'message-ai'"
    >
      <div class="message-header">
        <i [class]="msg.from === 'Usuario' ? 'fa-solid fa-user' : 'fa-solid fa-robot'"></i>
        <strong>{{ msg.from }}</strong>
      </div>
      <div class="message-content">{{ msg.prompt }}</div>
    </div>

    <!-- Indicador de carga -->
    <div *ngIf="loading" class="message-ai loading-indicator">
      <div class="message-header">
        <i class="fa-solid fa-robot"></i>
        <strong>Scrum AI</strong>
      </div>
      <div class="message-content">
        <span class="dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
        Escribiendo...
      </div>
    </div>
  </div>

  <!-- Input en la parte inferior -->
  <div class="input-area">
    <input
      #userInput
      type="text"
      placeholder="Escribe tu pregunta..."
      (keyup.enter)="sendMessage(userInput)"
      [disabled]="loading"
    />
    <button
      (click)="sendMessage(userInput)"
      [disabled]="loading"
      class="send-button"
    >
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

</div>
